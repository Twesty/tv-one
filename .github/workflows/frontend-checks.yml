name: Frontend quality checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/player/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'render.yaml'
      - 'apps/api/src/app.ts'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/player/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production browser configuration generation
        env:
          PUBLIC_API_URL: https://tv-one.example.invalid
          SUPABASE_URL: https://project.example.invalid
          SUPABASE_ANON_KEY: public-anon-key-for-build-validation
        run: node scripts/write-browser-config.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck admin
        run: pnpm --filter @tv-one/admin typecheck

      - name: Build admin
        run: pnpm --filter @tv-one/admin build

      - name: Typecheck player
        run: pnpm --filter @tv-one/player typecheck

      - name: Build player
        run: pnpm --filter @tv-one/player build
